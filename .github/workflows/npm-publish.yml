# M06 / Q04 / Q05 — do not npm publish from a laptop.
# X05 gate: dry_run defaults to true. Uncheck it and tick publish_free / publish_pro.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and inspect only (no registry upload)
        type: boolean
        default: true
      publish_free:
        description: Publish @dashflowx/forms to npmjs (public)
        type: boolean
        default: false
      publish_pro:
        description: Publish @dashflowx/forms-pro to GitHub Packages (private)
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag for the free package
        type: choice
        default: latest
        options: [latest, next]

concurrency:
  group: publish-npm-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CORE_REPO: BhupeshChauhan/dashflowx-core

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: dashflow-forms
    steps:
      - name: Checkout forms
        uses: actions/checkout@v4
        with:
          path: dashflow-forms

      - name: Checkout sibling core for file peer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: dashflowx-core

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: dashflow-forms/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint
      - run: yarn build

      - name: Inspect free tarball (no src/pro)
        run: node scripts/pack-inspect.mjs .

      - name: Inspect pro tarball
        run: node scripts/pack-inspect.mjs forms-pro

      - name: Stop after dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — not uploading. Re-run with dry_run unchecked and publish_free/publish_pro ticked."

      - name: Require NPM_TOKEN for free publish
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Set repository secret NPM_TOKEN (npmjs granular token with bypass 2FA)."
            exit 1
          fi

      - name: Publish @dashflowx/forms to npmjs
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/npmjs.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry=https://registry.npmjs.org/
          EOF
          echo "Publishing @dashflowx/forms to https://registry.npmjs.org (tag ${{ inputs.dist_tag }})"
          npm publish --userconfig "$RUNNER_TEMP/npmjs.npmrc" --access public --tag "${{ inputs.dist_tag }}" --ignore-scripts --provenance

      - name: Publish @dashflowx/forms-pro to GitHub Packages
        if: ${{ !inputs.dry_run && inputs.publish_pro }}
        working-directory: dashflow-forms/forms-pro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/github.npmrc" <<EOF
          @dashflowx:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          echo "Publishing @dashflowx/forms-pro to https://npm.pkg.github.com"
          npm publish --userconfig "$RUNNER_TEMP/github.npmrc" --ignore-scripts

      - name: Verify free package on npmjs
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        run: npm view @dashflowx/forms version

      - name: Confirm Pro is not on public npmjs
        if: ${{ !inputs.dry_run && inputs.publish_pro }}
        run: |
          if npm view @dashflowx/forms-pro version >/dev/null 2>&1; then
            echo "::error::@dashflowx/forms-pro must not exist on registry.npmjs.org"
            exit 1
          fi
          echo "Pro is not listed on public npmjs (expected)."
