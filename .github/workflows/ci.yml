name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# file:../dashflowx-core peer until C08 is on npmjs. Checkout both repos as siblings.
env:
  CORE_REPO: BhupeshChauhan/dashflowx-core

jobs:
  verify:
    name: Lint / test / pack inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout forms
        uses: actions/checkout@v4
        with:
          path: dashflow-forms

      - name: Checkout sibling core for file peer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: dashflowx-core

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: dashflow-forms/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: dashflow-forms
      - run: yarn test
        working-directory: dashflow-forms
      - run: yarn lint
        working-directory: dashflow-forms
      - run: yarn build
        working-directory: dashflow-forms
      - name: Inspect free tarball (no src/pro)
        working-directory: dashflow-forms
        run: node scripts/pack-inspect.mjs .
      - name: Inspect pro tarball
        working-directory: dashflow-forms
        run: node scripts/pack-inspect.mjs forms-pro
